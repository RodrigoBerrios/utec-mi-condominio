service: g2-ms-notificaciones

frameworkVersion: '3'

custom:
  dotenv:
    path: ../.env
  esbuild:
    bundle: true
    minify: false        # Si quieres minimizar el código en producción, pon true
    sourcemap: true      # Útil para debugging, puedes quitarlo en prod
    target: 'node18'     # Asegúrate de usar el target que corresponda a Node.js 18+
    platform: 'node'     # Lambda corre Node.js, no "browser"
    keepNames: true      # Opcional: conserva nombres de funciones/clases
    external:
      - aws-sdk         # AWS Lambda ya provee aws-sdk, no es necesario empaquetarlo
    exclude:
      - 'aws-sdk'
    mainFields: ['main', 'module']  # Resolución de campos en package.json
    define:
      'process.env.NODE_ENV': '"production"'

provider:
  name: aws
  runtime: nodejs18.x
  stage: ${opt:stage, 'dev'}
  region: us-east-1
  environment:
    STAGE: ${self:provider.stage}
    DYNAMODB_TABLE: ${self:service}-${self:provider.stage}-notificaciones
    EVENTBRIDGE_BUS: ${env:EVENTBRIDGE_BUS}
    FROM_EMAIL: ${env:FROM_EMAIL}
  iamRoleStatements:
    - Effect: Allow
      Action:
        - dynamodb:Query
        - dynamodb:Scan
        - dynamodb:GetItem
        - dynamodb:PutItem
        - dynamodb:UpdateItem
        - dynamodb:DeleteItem
      Resource: 
        - "arn:aws:dynamodb:${self:provider.region}:*:table/${self:provider.environment.DYNAMODB_TABLE}"
        - "arn:aws:dynamodb:${self:provider.region}:*:table/${self:provider.environment.DYNAMODB_TABLE}/index/*"
    - Effect: Allow
      Action:
        - ses:SendEmail
        - ses:SendRawEmail
      Resource: "*"

plugins:
  - serverless-dotenv-plugin
  - serverless-esbuild
  - serverless-offline

package:
  # No incluyas todas las devDependencies en el ZIP final (por lo general solo necesitas las dependencies de runtime)
  excludeDevDependencies: true

  # Si quieres afinar aún más, puedes usar patterns para quitar archivos innecesarios
  # (por ejemplo, tests, documentación, carpetas de tipos, etc.)
  patterns:

    # Excluimos archivos de tests de los módulos que no necesitas en producción
    - '!**/node_modules/**/*'
    - '!node_modules/**/crc-32/types/**'
    - '!node_modules/**/test/**'
    - '!node_modules/**/tests/**'
    - '!node_modules/**/doc/**'
    - '!node_modules/**/*.md'        # archivos Markdown de los paquetes
    - '!node_modules/**/*.ts'        # a veces hay archivos .ts en subcarpetas
    - '!node_modules/**/tslint.json' # quita tslint.json de los módulos (no necesario en production)
    # Si tu carpeta de compilado es .build, debes excluir desde allí:
    - '!.build/node_modules/**/*'
    - '!.build/node_modules/**/crc-32/types/**'
    - '!.build/node_modules/**/test/**'
    - '!.build/node_modules/**/tests/**'
    - '!.build/node_modules/**/doc/**'
    - '!.build/node_modules/**/*.md'
    - '!.build/node_modules/**/*.ts'
    - '!.build/node_modules/**/tslint.json'

functions:
  # Endpoints REST para gestión manual de notificaciones
  crearNotificacion:
    handler: src/handlers/notificaciones.crearNotificacion
    events:
      - http:
          path: /notificaciones
          method: post
          cors: true

  confNotificacionAutomatica:
    handler: src/handlers/notificaciones.configurarNotificacionAutomatica
    events:
      - http:
          path: /notificaciones/automaticas
          method: post
          cors: true

  obtenerHistorial:
    handler: src/handlers/notificaciones.obtenerHistorial
    events:
      - http:
          path: /notificaciones/historial
          method: get
          cors: true

  obtenerConfiguraciones:
    handler: src/handlers/notificaciones.obtenerConfiguraciones
    events:
      - http:
          path: /notificaciones/configuraciones
          method: get
          cors: true

  # Handlers para eventos automáticos desde otros microservicios
  handleCuotaVencida:
    handler: src/handlers/events.handleCuotaVencida
    events:
      - eventBridge:
          eventBus: ${self:provider.environment.EVENTBRIDGE_BUS}
          pattern:
            source: ["ms-cuotas"]
            detail-type: ["Cuota Vencida"]

  handleRecordatorioPago:
    handler: src/handlers/events.handleRecordatorioPago
    events:
      - eventBridge:
          eventBus: ${self:provider.environment.EVENTBRIDGE_BUS}
          pattern:
            source: ["ms-cuotas"]
            detail-type: ["Recordatorio Pago"]

resources:
  Resources:
    NotificacionesTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: ${self:provider.environment.DYNAMODB_TABLE}
        AttributeDefinitions:
          - AttributeName: notificacionId
            AttributeType: S
          - AttributeName: destinatario
            AttributeType: S
          - AttributeName: fechaCreacion
            AttributeType: S
        KeySchema:
          - AttributeName: notificacionId
            KeyType: HASH
        GlobalSecondaryIndexes:
          - IndexName: UsuarioIndex
            KeySchema:
              - AttributeName: destinatario
                KeyType: HASH
              - AttributeName: fechaCreacion
                KeyType: RANGE
            Projection:
              ProjectionType: ALL
          - IndexName: FechaCreacionIndex
            KeySchema:
              - AttributeName: fechaCreacion
                KeyType: HASH
            Projection:
              ProjectionType: ALL
        BillingMode: PAY_PER_REQUEST 