name: Deploy to AWS

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  # Determinar el ambiente basado en la rama
  determine-environment:
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.set-env.outputs.environment }}
      deploy: ${{ steps.set-env.outputs.deploy }}
    steps:
      - name: Determine environment
        id: set-env
        run: |
          if [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            echo "environment=production" >> $GITHUB_OUTPUT
            echo "deploy=true" >> $GITHUB_OUTPUT
          elif [[ "${{ github.ref }}" == "refs/heads/develop" ]]; then
            echo "environment=development" >> $GITHUB_OUTPUT
            echo "deploy=true" >> $GITHUB_OUTPUT
          else
            echo "environment=development" >> $GITHUB_OUTPUT
            echo "deploy=false" >> $GITHUB_OUTPUT
          fi

  # Job 1: PRIMERO - Desplegar infraestructura con Terraform
  deploy-infrastructure:
    runs-on: ubuntu-latest
    needs: [determine-environment]
    if: needs.determine-environment.outputs.deploy == 'true'
    environment: ${{ needs.determine-environment.outputs.environment }}
    outputs:
      api_gateway_url: ${{ steps.terraform-outputs.outputs.api_gateway_url }}
      cognito_user_pool_id: ${{ steps.terraform-outputs.outputs.cognito_user_pool_id }}
      cognito_client_id: ${{ steps.terraform-outputs.outputs.cognito_client_id }}
      aurora_endpoint: ${{ steps.terraform-outputs.outputs.aurora_endpoint }}
      documents_bucket: ${{ steps.terraform-outputs.outputs.documents_bucket }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Setup Terraform
        run: |
          wget -O- https://apt.releases.hashicorp.com/gpg | sudo gpg --dearmor -o /usr/share/keyrings/hashicorp-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/hashicorp-archive-keyring.gpg] https://apt.releases.hashicorp.com $(lsb_release -cs) main" | sudo tee /etc/apt/sources.list.d/hashicorp.list
          sudo apt update && sudo apt install terraform=1.5.0-1

      - name: Deploy infrastructure with Terraform
        working-directory: terraform
        run: |
          echo "🏗️ Desplegando infraestructura con Terraform..."
          
          terraform init
          terraform plan -var="environment=${{ needs.determine-environment.outputs.environment }}" -out=tfplan
          terraform apply -auto-approve tfplan
          
          echo "✅ Infraestructura desplegada exitosamente"

      - name: Get Terraform outputs
        id: terraform-outputs
        working-directory: terraform
        run: |
          echo "api_gateway_url=$(terraform output -raw api_gateway_url 2>/dev/null || echo '')" >> $GITHUB_OUTPUT
          echo "cognito_user_pool_id=$(terraform output -raw cognito_user_pool_id 2>/dev/null || echo '')" >> $GITHUB_OUTPUT
          echo "cognito_client_id=$(terraform output -raw cognito_user_pool_client_id 2>/dev/null || echo '')" >> $GITHUB_OUTPUT
          echo "aurora_endpoint=$(terraform output -raw aurora_cluster_endpoint 2>/dev/null || echo '')" >> $GITHUB_OUTPUT
          echo "documents_bucket=$(terraform output -raw documents_bucket_name 2>/dev/null || echo '')" >> $GITHUB_OUTPUT

  # Job 2: SEGUNDO - Desplegar microservicios con Serverless (usando outputs de Terraform)
  deploy-microservices:
    runs-on: ubuntu-latest
    needs: [determine-environment, deploy-infrastructure]
    if: needs.determine-environment.outputs.deploy == 'true'
    environment: ${{ needs.determine-environment.outputs.environment }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Install Serverless Framework
        run: |
          npm install -g serverless@3.38.0
          npm install -g serverless-esbuild@1.55.0
          npm install -g serverless-dotenv-plugin@6.0.0  
          npm install -g serverless-offline@13.0.0
          serverless --version
          echo "✅ Serverless Framework y plugins instalados globalmente"

      - name: Deploy microservices with Serverless
        env:
          API_GATEWAY_URL: ${{ needs.deploy-infrastructure.outputs.api_gateway_url }}
          COGNITO_USER_POOL_ID: ${{ needs.deploy-infrastructure.outputs.cognito_user_pool_id }}
          COGNITO_CLIENT_ID: ${{ needs.deploy-infrastructure.outputs.cognito_client_id }}
          AURORA_ENDPOINT: ${{ needs.deploy-infrastructure.outputs.aurora_endpoint }}
          DOCUMENTS_BUCKET: ${{ needs.deploy-infrastructure.outputs.documents_bucket }}
        run: |
          # Lista de microservicios a desplegar
          MICROSERVICES=("ms-inmuebles" "ms-cuotas" "ms-gastos" "ms-junta" "ms-pagos" "ms-notificaciones" "ms-inmobiliarias")
          
          echo "🚀 Desplegando microservicios en ambiente: ${{ needs.determine-environment.outputs.environment }}"
          echo "📋 Variables de infraestructura disponibles:"
          echo "  - API Gateway URL: $API_GATEWAY_URL"
          echo "  - Cognito User Pool: $COGNITO_USER_POOL_ID"
          echo "  - Aurora Endpoint: $AURORA_ENDPOINT"
          echo "  - Documents Bucket: $DOCUMENTS_BUCKET"
          
          for service in "${MICROSERVICES[@]}"; do
            if [ -d "$service" ]; then
              echo "📦 Desplegando $service..."
              cd $service
              
              # Verificar que existe serverless.yml
              if [ ! -f "serverless.yml" ]; then
                echo "❌ Error: serverless.yml no encontrado en $service"
                cd ..
                continue
              fi
              
              # Limpiar cache y builds anteriores
              rm -rf .serverless .build node_modules/.cache
              
              # Instalar dependencias del microservicio
              if [ -f "package.json" ]; then
                echo "📋 Instalando dependencias para $service..."
                npm ci --legacy-peer-deps --ignore-scripts
              fi
              
              # Verificar configuración de Serverless
              echo "🔧 Verificando configuración de $service..."
              serverless print --stage ${{ needs.determine-environment.outputs.environment }} || {
                echo "❌ Error en configuración de $service"
                cd ..
                continue  
              }
              
              # Desplegar con Serverless
              echo "🚀 Iniciando deploy de $service..."
              serverless deploy \
                --stage ${{ needs.determine-environment.outputs.environment }} \
                --verbose \
                --force || {
                echo "❌ Error desplegando $service"
                cd ..
                exit 1
              }
              
              echo "✅ $service desplegado exitosamente"
              cd ..
            else
              echo "⚠️ Directorio $service no encontrado, saltando..."
            fi
          done

  # Job 3: TERCERO - Aplicar esquema de base de datos
  deploy-database:
    runs-on: ubuntu-latest
    needs: [determine-environment, deploy-infrastructure, deploy-microservices]
    if: needs.determine-environment.outputs.deploy == 'true'
    environment: ${{ needs.determine-environment.outputs.environment }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Setup Terraform (for outputs)
        run: |
          wget -O- https://apt.releases.hashicorp.com/gpg | sudo gpg --dearmor -o /usr/share/keyrings/hashicorp-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/hashicorp-archive-keyring.gpg] https://apt.releases.hashicorp.com $(lsb_release -cs) main" | sudo tee /etc/apt/sources.list.d/hashicorp.list
          sudo apt update && sudo apt install terraform=1.5.0-1

      - name: Get Database Credentials
        working-directory: terraform
        run: |
          terraform init
          
          # Obtener credenciales de la base de datos
          DB_HOST=$(terraform output -raw aurora_cluster_endpoint 2>/dev/null || echo "")
          DB_SECRET_ARN=$(terraform output -raw aurora_secret_arn 2>/dev/null || echo "")
          
          echo "DB_HOST=$DB_HOST" >> $GITHUB_ENV
          echo "DB_SECRET_ARN=$DB_SECRET_ARN" >> $GITHUB_ENV

      - name: Apply Database Schema
        run: |
          # Instalar PostgreSQL client
          sudo apt-get update
          sudo apt-get install -y postgresql-client jq
          
          if [ -n "$DB_SECRET_ARN" ]; then
            # Obtener credenciales del secret manager
            SECRET=$(aws secretsmanager get-secret-value --secret-id $DB_SECRET_ARN --query SecretString --output text)
            DB_PASSWORD=$(echo $SECRET | jq -r .password)
            DB_USER=$(echo $SECRET | jq -r .username)
            DB_NAME=$(echo $SECRET | jq -r .dbname)
            
            # Aplicar esquema si el archivo existe
            if [ -f database-schema.sql ]; then
              echo "📊 Aplicando esquema de base de datos..."
              export PGPASSWORD=$DB_PASSWORD
              psql -h $DB_HOST -U $DB_USER -d $DB_NAME -f database-schema.sql
              echo "✅ Esquema aplicado exitosamente"
            else
              echo "⚠️ No se encontró database-schema.sql, saltando..."
            fi
          else
            echo "⚠️ No se encontraron credenciales de base de datos, saltando..."
          fi

      - name: Get Deployment Summary
        run: |
          echo "## 🚀 Deployment Successful!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Environment: ${{ needs.determine-environment.outputs.environment }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Deployment Order:" >> $GITHUB_STEP_SUMMARY
          echo "1. ✅ **Infrastructure** (Terraform) - VPC, RDS, Lambda, API Gateway, etc." >> $GITHUB_STEP_SUMMARY
          echo "2. ✅ **Microservices** (Serverless) - Business logic deployment" >> $GITHUB_STEP_SUMMARY
          echo "3. ✅ **Database Schema** - Tables and initial data" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Microservices Deployed:" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ ms-inmuebles" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ ms-cuotas" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ ms-gastos" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ ms-junta" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ ms-pagos" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ ms-notificaciones" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ ms-inmobiliarias" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Infrastructure URLs:" >> $GITHUB_STEP_SUMMARY
          echo "- **API Gateway URL:** ${{ needs.deploy-infrastructure.outputs.api_gateway_url }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Cognito User Pool ID:** ${{ needs.deploy-infrastructure.outputs.cognito_user_pool_id }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Database Endpoint:** ${{ needs.deploy-infrastructure.outputs.aurora_endpoint }}" >> $GITHUB_STEP_SUMMARY 