service: g2-ms-cuotas

frameworkVersion: '3'

custom:
  dotenv:
    path: ../.env
  esbuild:
    bundle: true
    minify: false        # Si quieres minimizar el código en producción, pon true
    sourcemap: true      # Útil para debugging, puedes quitarlo en prod
    target: 'node18'     # Asegúrate de usar el target que corresponda a Node.js 18+
    platform: 'node'     # Lambda corre Node.js, no "browser"
    keepNames: true      # Opcional: conserva nombres de funciones/clases
    external:
      - aws-sdk         # AWS Lambda ya provee aws-sdk, no es necesario empaquetarlo
      - pg-native       # PostgreSQL native opcional
    exclude:
      - 'aws-sdk'
    mainFields: ['main', 'module']  # Resolución de campos en package.json
    define:
      'process.env.NODE_ENV': '"production"'

provider:
  name: aws
  runtime: nodejs18.x
  stage: ${opt:stage, 'dev'}
  region: us-east-1
  environment:
    STAGE: ${self:provider.stage}
    DB_HOST: ${env:DB_HOST}
    DB_PORT: ${env:DB_PORT}
    DB_NAME: ${env:DB_NAME}
    DB_USER: ${env:DB_USER}
    DB_PASSWORD: ${env:DB_PASSWORD}
    EVENTBRIDGE_BUS: ${env:EVENTBRIDGE_BUS}
  iamRoleStatements:
    - Effect: Allow
      Action:
        - events:PutEvents
      Resource: "*"
    - Effect: Allow
      Action:
        - rds:DescribeDBInstances
        - rds:Connect
      Resource: "*"

plugins:
  - serverless-dotenv-plugin
  - serverless-esbuild
  - serverless-offline

package:
  # No incluyas todas las devDependencies en el ZIP final (por lo general solo necesitas las dependencies de runtime)
  excludeDevDependencies: true

  # Si quieres afinar aún más, puedes usar patterns para quitar archivos innecesarios
  # (por ejemplo, tests, documentación, carpetas de tipos, etc.)
  patterns:

    # Excluimos archivos de tests de los módulos que no necesitas en producción
    - '!**/node_modules/**/*'
    - '!node_modules/**/crc-32/types/**'
    - '!node_modules/**/test/**'
    - '!node_modules/**/tests/**'
    - '!node_modules/**/doc/**'
    - '!node_modules/**/*.md'        # archivos Markdown de los paquetes
    - '!node_modules/**/*.ts'        # a veces hay archivos .ts en subcarpetas
    - '!node_modules/**/tslint.json' # quita tslint.json de los módulos (no necesario en production)
    # Si tu carpeta de compilado es .build, debes excluir desde allí:
    - '!.build/node_modules/**/*'
    - '!.build/node_modules/**/crc-32/types/**'
    - '!.build/node_modules/**/test/**'
    - '!.build/node_modules/**/tests/**'
    - '!.build/node_modules/**/doc/**'
    - '!.build/node_modules/**/*.md'
    - '!.build/node_modules/**/*.ts'
    - '!.build/node_modules/**/tslint.json'

functions:
  createCuota:
    handler: src/handlers/cuotas.create
    events:
      - http:
          path: /cuotas
          method: post
          cors: true

  listCuotas:
    handler: src/handlers/cuotas.list
    events:
      - http:
          path: /cuotas
          method: get
          cors: true

  getCuota:
    handler: src/handlers/cuotas.getById
    events:
      - http:
          path: /cuotas/{id}
          method: get
          cors: true

  updateCuota:
    handler: src/handlers/cuotas.update
    events:
      - http:
          path: /cuotas/{id}
          method: put
          cors: true

  deleteCuota:
    handler: src/handlers/cuotas.delete
    events:
      - http:
          path: /cuotas/{id}
          method: delete
          cors: true

  markCuotaPagada:
    handler: src/handlers/cuotas.markPagada
    events:
      - http:
          path: /cuotas/{id}/pagar
          method: post
          cors: true

  getCuotasByUsuario:
    handler: src/handlers/cuotas.getByUsuario
    events:
      - http:
          path: /cuotas/usuario/{idUsuario}
          method: get
          cors: true

  getCuotasByPeriodo:
    handler: src/handlers/cuotas.getByPeriodo
    events:
      - http:
          path: /cuotas/periodo/{periodo}
          method: get
          cors: true

  getEstadoCuenta:
    handler: src/handlers/cuotas.getEstadoCuenta
    events:
      - http:
          path: /estado-cuenta/{idUsuario}
          method: get
          cors: true

  getMorosos:
    handler: src/handlers/cuotas.getMorosos
    events:
      - http:
          path: /morosidad
          method: get
          cors: true

  getResumenCuotas:
    handler: src/handlers/resumen.get
    events:
      - http:
          path: /cuotas/resumen
          method: get
          cors: true

  getReporteCuotas:
    handler: src/handlers/reportes.cuotas
    events:
      - http:
          path: /cuotas/reporte
          method: get
          cors: true

  getCuotasVencidas:
    handler: src/handlers/cuotas.getVencidas
    events:
      - http:
          path: /cuotas/vencidas
          method: get
          cors: true

  generateCuotasMasivas:
    handler: src/handlers/cuotas.generateMasivas
    events:
      - http:
          path: /cuotas/generar-masivas
          method: post
          cors: true

  # CRON para verificar cuotas vencidas y enviar eventos
  checkCuotasVencidas:
    handler: src/handlers/cron.checkCuotasVencidas
    events:
      - schedule: rate(1 day)  # Ejecuta diariamente

  # CRON para generar cuotas mensuales automáticamente
  generateCuotasMensuales:
    handler: src/handlers/cron.generateCuotasMensuales
    events:
      - schedule: cron(0 0 1 * ? *)  # Ejecuta el día 1 de cada mes a las 00:00 